<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 Años - Julieta</title>
    
    <!-- Fuentes elegantes de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           VARIABLES DE COLOR Y DISEÑO (MODIFICABLES)
           ========================================== */
        :root {
            --color-rosado-claro: #fbebf0; /* Fondo de botones y colores claros */
            --color-rosado-medio: #e995a9; /* Bordes y sombras */
            --color-rosado-oscuro: #c25a76; /* Texto principal */
            --color-blanco: #ffffff;
            
            --fuente-elegante: 'Cormorant Garamond', serif;
            --fuente-moderna: 'Montserrat', sans-serif;
        }

        /* Reset básico para que parezca un lienzo continuo */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-blanco);
            font-family: var(--fuente-moderna);
            overflow-x: hidden;
        }

        /* Contenedor principal estilo móvil */
        .invitacion-lienzo {
            max-width: 600px; /* Tamaño máximo para tablets/PC */
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Cada sección contiene una imagen y sus elementos interactivos */
        .seccion {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .seccion img {
            width: 100%;
            display: block; /* Elimina márgenes inferiores de las imágenes */
        }

        /* ==========================================
           ESTILOS DE BOTONES
           ========================================== */
        .boton-interactivo {
            position: absolute;
            background-color: var(--color-rosado-claro);
            color: var(--color-rosado-oscuro);
            font-family: var(--fuente-elegante);
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 30px;
            border: 2px solid var(--color-rosado-medio);
            box-shadow: 0 4px 10px rgba(233, 149, 169, 0.3);
            transform: translate(-50%, -50%); /* Centra el botón en su coordenada */
            text-align: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .boton-interactivo:active {
            transform: translate(-50%, -45%);
            box-shadow: 0 2px 5px rgba(233, 149, 169, 0.3);
        }

        /* ==========================================
           CUENTA REGRESIVA ELEGANTE (NUEVA VERSIÓN)
           ========================================== */
        .contador-caja {
            position: absolute;
            top: 76%; /* Mantiene la misma altura que solicitaste */
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.9); /* Blanco elegante con leve transparencia */
            border: 2px solid var(--color-rosado-medio);
            border-radius: 25px; /* Esquinas redondeadas */
            padding: 25px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Dos columnas */
            gap: 20px 40px; /* Separación entre filas y columnas */
            box-shadow: 0 8px 25px rgba(233, 149, 169, 0.4);
            width: 80%;
            max-width: 320px;
            z-index: 10;
        }

        .tiempo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--color-rosado-oscuro);
        }

        .tiempo-item span {
            font-family: var(--fuente-elegante);
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .tiempo-item p {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* ==========================================
           CARRUSEL DE IMÁGENES
           ========================================== */
        .carrusel-contenedor {
            position: absolute;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 15px;
            padding: 10px;
            transform: translateX(-50%);
            /* Oculta la barra de scroll */
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }
        .carrusel-contenedor::-webkit-scrollbar { 
            display: none; 
        }

        .carrusel-item {
            scroll-snap-align: center;
            flex: 0 0 200px; /* Ancho de cada foto en el carrusel */
            height: 250px;
            border-radius: 15px;
            border: 3px solid var(--color-rosado-claro);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            object-fit: cover; /* Recorta la imagen para que encaje perfecto */
            background-color: #fcecf0;
        }

        /* ==========================================
           BOTÓN DE MÚSICA FLOTANTE
           ========================================== */
        .boton-musica {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: var(--color-rosado-claro);
            border: 2px solid var(--color-rosado-medio);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--color-rosado-oscuro);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            animation: latido 2s infinite;
        }
        
        /* Animación suave para la música */
        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pausado {
            animation: none;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR DE AUDIO OCULTO -->
    <audio id="musicaFondo" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <!-- BOTÓN DE MÚSICA FLOTANTE -->
    <div id="toggleMusica" class="boton-musica pausado">
        🎵
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="invitacion-lienzo">

        <!-- PORTADA -->
        <div class="seccion">
            <img src="portada.png" alt="Portada de la Invitación">
        </div>

        <!-- IMAGEN 1: CUENTA REGRESIVA -->
        <div class="seccion">
            <img src="IMAGEN1.png" alt="Faltan...">
            <!-- NUEVA CAJA DE CONTADOR (No usa círculos y mantiene el top: 76%) -->
            <div class="contador-caja">
                <!-- Arriba -->
                <div class="tiempo-item"><span id="dias">00</span><p>Días</p></div>
                <div class="tiempo-item"><span id="horas">00</span><p>Hs</p></div>
                <!-- Abajo -->
                <div class="tiempo-item"><span id="minutos">00</span><p>Min</p></div>
                <div class="tiempo-item"><span id="segundos">00</span><p>Seg</p></div>
            </div>
        </div>

        <!-- IMAGEN 2: BOTÓN DE UBICACIÓN -->
        <div class="seccion">
            <img src="IMAGEN2.png" alt="Fecha y Lugar">
            <a href="https://maps.google.com" target="_blank" class="boton-interactivo" 
               style="top: 86%; left: 50%; width: 60%; font-size: 1.3rem;">
                Ver Ubicación
            </a>
        </div>

        <!-- IMAGEN 3: CARRUSEL DE FOTOS -->
        <div class="seccion">
            <img src="IMAGEN3.png" alt="Mis Recuerdos">
            <div class="carrusel-contenedor" style="top: 67%; left: 50%; width: 90%;">
                <img src="https://via.placeholder.com/200x250/fcecf0/e995a9?text=Foto+1" alt="Recuerdo 1" class="carrusel-item">
                <img src="https://via.placeholder.com/200x250/fcecf0/e995a9?text=Foto+2" alt="Recuerdo 2" class="carrusel-item">
                <img src="https://via.placeholder.com/200x250/fcecf0/e995a9?text=Foto+3" alt="Recuerdo 3" class="carrusel-item">
                <img src="https://via.placeholder.com/200x250/fcecf0/e995a9?text=Foto+4" alt="Recuerdo 4" class="carrusel-item">
            </div>
        </div>

        <!-- IMAGEN 4: CONFIRMAR ASISTENCIA -->
        <div class="seccion">
            <img src="imagen4.png" alt="Confirmar Asistencia">
            <a href="https://docs.google.com/forms/..." target="_blank" class="boton-interactivo" 
               style="top: 48%; left: 50%; width: 75%;">
                Confirmar Asistencia
            </a>
            <!-- El rectángulo blanco que tapaba la imagen5 ha sido eliminado por completo de aquí -->
        </div>

        <!-- IMAGEN 5: SUGERIR CANCIÓN Y REGALOS -->
        <div class="seccion">
            <img src="imagen5.png" alt="Playlist y Regalos">
            
            <a href="https://docs.google.com/forms/..." id="btn-cancion" target="_blank" class="boton-interactivo" 
               style="top: 41%; left: 50%; width: 70%;">
                Sugerir Canción
            </a>
            
            <!-- NUEVO: Botón de Subir Fotos en la parte inferior -->
            <a href="https://ruta-para-subir-fotos.com" id="btn-fotos" target="_blank" class="boton-interactivo" 
               style="top: 85%; left: 50%; width: 70%;">
                Subir Fotos
            </a>
        </div>

        <!-- IMAGEN 6: CIERRE -->
        <div class="seccion">
            <img src="imagen6.png" alt="Cierre" onerror="this.style.display='none'">
        </div>

    </div>

    <!-- ==========================================
         SCRIPTS: FUNCIONALIDAD
         ========================================== -->
    <script>
        /* --- CONFIGURACIÓN DE BOTONES (OPCIONES DE ACTIVAR/DESACTIVAR) --- */
        // Cambia `true` a `false` si deseas ocultar alguno de los botones.
        const activarBotonCancion = true; 
        const activarBotonFotos = true;   

        // Lógica que evalúa las opciones de arriba para ocultar los botones
        if (!activarBotonCancion) {
            document.getElementById("btn-cancion").style.display = "none";
        }
        if (!activarBotonFotos) {
            document.getElementById("btn-fotos").style.display = "none";
        }

        /* --- 1. CONFIGURACIÓN FECHA CUENTA REGRESIVA --- */
        // Formato: Mes Día, Año Hora:Minutos:Segundos
        const fechaEvento = new Date("Oct 10, 2026 20:00:00").getTime();

        const intervalo = setInterval(function() {
            const ahora = new Date().getTime();
            const distancia = fechaEvento - ahora;

            // Cálculos de tiempo
            const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

            // Mostrar en el HTML (con ceros a la izquierda si es menor a 10)
            document.getElementById("dias").innerHTML = dias < 10 ? "0" + dias : dias;
            document.getElementById("horas").innerHTML = horas < 10 ? "0" + horas : horas;
            document.getElementById("minutos").innerHTML = minutos < 10 ? "0" + minutos : minutos;
            document.getElementById("segundos").innerHTML = segundos < 10 ? "0" + segundos : segundos;

            // Si la fecha ya pasó
            if (distancia < 0) {
                clearInterval(intervalo);
                document.getElementById("dias").innerHTML = "00";
                document.getElementById("horas").innerHTML = "00";
                document.getElementById("minutos").innerHTML = "00";
                document.getElementById("segundos").innerHTML = "00";
            }
        }, 1000);

        /* --- 2. CONFIGURACIÓN MÚSICA (AUTOPLAY) --- */
        const audio = document.getElementById("musicaFondo");
        const btnMusica = document.getElementById("toggleMusica");
        let reproducido = false;

        document.body.addEventListener('click', function() {
            if (!reproducido) {
                audio.play().catch(error => console.log("Autoplay bloqueado"));
                btnMusica.classList.remove("pausado");
                reproducido = true;
            }
        }, { once: true });

        btnMusica.addEventListener('click', function(e) {
            e.stopPropagation();
            if (audio.paused) {
                audio.play();
                btnMusica.classList.remove("pausado");
            } else {
                audio.pause();
                btnMusica.classList.add("pausado");
            }
        });
    </script>
</body>
</html>
